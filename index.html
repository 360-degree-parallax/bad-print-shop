<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="오이디푸스 왕 문서. 문장을 누르면 오른쪽 포스터로 옮겨집니다. 불량 인쇄소."><title>불량 인쇄소</title><link rel="preload" href="assets/DreamHeumulPrint.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="style.css?v=202610140041"></head><body>
<main class="layout">
 <article class="book" id="book" aria-label="수집할 문장">
  <div class="wiki-card">
   <div id="prose" class="wiki-body"></div>
  </div>
  <footer class="wiki-foot">
   <p>이 문서의 모든 문장은 소포클레스, 프랜시스 스토어, 번역 AI, 그리고 앞서 다녀간 방문자들의 것입니다.</p>
   <p>당신이 가져간 문장은 당신의 것이 아닐 수 있습니다.</p>
  </footer>
 </article>
 <aside class="side">
  <section id="posterScroller" class="print" aria-label="수집한 문장으로 만든 포스터"><div id="posterSurface"><canvas id="poster" width="840" height="1188" tabindex="0" aria-label="수집한 문장과 사진이 인쇄되는 포스터"></canvas></div></section>
 </aside>
</main>
<dialog id="settingsDialog"><button class="close" aria-label="닫기">×</button><h2>특수 기능</h2>
<label class="setting" for="sizeInput"><span>크기</span><output id="sizeValue">32px</output><input id="sizeInput" type="range" min="24" max="56" step="8" value="32"></label>
<label class="setting" for="widthInput"><span>너비</span><output id="widthValue">396px</output><input id="widthInput" type="range" min="240" max="396" value="396"></label>
<label class="setting" for="intensityInput"><span>풍화</span><output id="intensityValue">55%</output><input id="intensityInput" type="range" min="0" max="100" value="55"></label>
<p class="settings-note">문장은 앞 문장에 이어 인쇄됩니다. 문장을 길게 누르고, 마음에 드는 순간 놓으세요.</p></dialog>
<dialog id="note"><button class="close" aria-label="닫기">×</button><p id="noteText"></p></dialog>
<dialog id="receiptDialog"><button class="close" aria-label="닫기">×</button><canvas id="receiptRibbon" aria-label="수집한 문장의 영수증"></canvas><div class="downloads"><button id="savePoster">포스터 저장 ↓</button><button id="saveReceipt">영수증 PNG ↓</button></div></dialog>
<script src="effects.js?v=202610140041"></script><script src="content.js?v=202610140041"></script><script src="wiki.js?v=202610140041"></script><script src="receipt.js?v=202610140041"></script><script src="flow.js?v=202610140041"></script><script src="export.js?v=202610140041"></script><script src="content-gen.js?v=202610140041"></script><script src="app.js?v=202610140041"></script></body></html>
